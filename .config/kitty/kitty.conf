progress_bar hidden

# Fonts
font_size 12.0
disable_ligatures cursor
font_family      family="JetBrains Mono"
bold_font        family="JetBrains Mono" style="Bold"
italic_font      family="JetBrains Mono" style="Italic"
bold_italic_font family="JetBrains Mono" style="Bold Italic"
# (patch Kitty-provided nerd font icons)
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
# Increase font size
map kitty_mod+equal  change_font_size all +1.0
map kitty_mod+plus   change_font_size all +1.0
map kitty_mod+kp_add change_font_size all +1.0
map cmd+plus         change_font_size all +1.0
map cmd+equal        change_font_size all +1.0
map shift+cmd+equal  change_font_size all +1.0
# Decrease font size
map kitty_mod+minus       change_font_size all -1.0
map kitty_mod+kp_subtract change_font_size all -1.0
map cmd+minus             change_font_size all -1.0
map shift+cmd+minus       change_font_size all -1.0

# Text cursor
cursor_shape block
cursor_beam_thickness 1
cursor_underline_thickness 1
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.2
touch_scroll_multiplier 8.0

# Terminal bell
enable_audio_bell no

# Window layout
window_padding_width 2

# Color scheme options
background_opacity 0.97
dim_opacity 0.6

# Advanced
shell_integration no-cursor

# OS specific tweaks
# macos_titlebar_color background
macos_quit_when_last_window_closed yes
macos_show_window_title_in none

# Keyboard shortcuts
map shift+enter send_text all \n
map kitty_mod+r load_config_file
map cmd+r       load_config_file

